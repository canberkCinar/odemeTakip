name: Kart Odeme Kontrol

on:
  schedule:
    - cron: "0 6 * * *"   # her gun 06:00 UTC = 09:00 Turkiye saati
  workflow_dispatch:        # elle test: rapor da gonderilir

permissions:
  actions: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hatirlatici calistir
        run: node hatirlatici.js
        env:
          NETGSM_USER: ${{ secrets.NETGSM_USER }}
          NETGSM_PASS: ${{ secrets.NETGSM_PASS }}
          NETGSM_HEADER: ${{ secrets.NETGSM_HEADER }}
      - name: Workflow canli tut
        uses: gautamkrishnar/keepalive-workflow@v2
