name: Kart Odeme Kontrol

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hatirlatici calistir
        run: node hatirlatici.js
        env:
          NETGSM_USER: ${{ secrets.NETGSM_USER }}
          NETGSM_PASS: ${{ secrets.NETGSM_PASS }}
          NETGSM_HEADER: ${{ secrets.NETGSM_HEADER }}
