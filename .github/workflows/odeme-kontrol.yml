name: Kart Odeme Kontrol

on:
  schedule:
    - cron: "0 6 * * *"   # her gun 06:00 UTC = 09:00 Turkiye saati
  workflow_dispatch:        # elle test: rapor da gonderilir

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hatirlatici calistir
        run: node hatirlatici.js
